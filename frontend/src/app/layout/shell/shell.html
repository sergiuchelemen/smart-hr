<div class="shell">
  <header class="topbar">
    <p-button class="menu-btn" icon="pi pi-bars" [text]="true" severity="secondary" [rounded]="true"
              aria-label="Deschide meniul" (onClick)="drawerOpen.set(true)" />
    <a routerLink="/acasa" class="brand" aria-label="Smart HR, pagina de start"><app-logo [markSize]="28" /></a>
    <span class="company t-heading">{{ companyName() }}</span>
    <div class="spacer"></div>
    <span class="user t-body-sm t-muted">{{ email() }}</span>
    <p-select class="theme" [options]="themes" optionLabel="label" optionValue="value"
              [ngModel]="theme.choice()" (ngModelChange)="setTheme($event)"
              ariaLabel="Temă de culori" />
    <p-button class="switch" label="Schimbă compania" icon="pi pi-arrow-right-arrow-left" severity="secondary"
              [text]="true" (onClick)="switchCompany()" />
    <p-button label="Deconectare" icon="pi pi-sign-out" severity="secondary" [outlined]="true"
              (onClick)="logout()" />
  </header>

  <aside class="side">
    <ng-container *ngTemplateOutlet="nav" />
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>

<p-drawer [visible]="drawerOpen()" (visibleChange)="drawerOpen.set($event)" header="Meniu" position="left">
  <ng-container *ngTemplateOutlet="nav" />
</p-drawer>

<ng-template #nav>
  <nav aria-label="Navigare principală">
    <ul class="menu">
      <li>
        <a routerLink="/acasa" routerLinkActive="active" (click)="drawerOpen.set(false)">
          <i class="pi pi-home" aria-hidden="true"></i><span>Acasă</span>
        </a>
      </li>
      <li *appHasPermission="'LEAVE_REQUEST'">
        <a routerLink="/concedii" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="drawerOpen.set(false)">
          <i class="pi pi-calendar" aria-hidden="true"></i><span>Concedii</span>
        </a>
      </li>
      <li *appHasPermission="['LEAVE_APPROVE', 'LEAVE_APPROVE_ALL']; mode: 'any'">
        <a routerLink="/aprobari" routerLinkActive="active" (click)="drawerOpen.set(false)">
          <i class="pi pi-check-circle" aria-hidden="true"></i><span>Aprobări</span>
        </a>
      </li>
      <li *appHasPermission="'LEAVE_READ_ALL'">
        <a routerLink="/concedii/toate" routerLinkActive="active" (click)="drawerOpen.set(false)">
          <i class="pi pi-list" aria-hidden="true"></i><span>Toate cererile</span>
        </a>
      </li>
      <li *appHasPermission="'EMPLOYEE_READ'">
        <a routerLink="/angajati" routerLinkActive="active" (click)="drawerOpen.set(false)">
          <i class="pi pi-users" aria-hidden="true"></i><span>Angajați</span>
        </a>
      </li>
      <li *appHasPermission="['USER_READ', 'USER_MANAGE', 'ROLE_MANAGE']; mode: 'any'" class="group">
        <span class="group-label t-label t-muted">Administrare</span>
        <ul class="menu" aria-label="Administrare">
          <li *appHasPermission="['USER_READ', 'USER_MANAGE']; mode: 'any'">
            <a routerLink="/admin/utilizatori" routerLinkActive="active" (click)="drawerOpen.set(false)">
              <i class="pi pi-user" aria-hidden="true"></i><span>Utilizatori</span>
            </a>
          </li>
          <li *appHasPermission="'ROLE_MANAGE'">
            <a routerLink="/admin/roluri" routerLinkActive="active" (click)="drawerOpen.set(false)">
              <i class="pi pi-shield" aria-hidden="true"></i><span>Roluri și privilegii</span>
            </a>
          </li>
        </ul>
      </li>
    </ul>
  </nav>
</ng-template>
