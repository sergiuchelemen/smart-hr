spring:
  application:
    name: smart-hr
  config:
    import: "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}?logServerErrorDetail=false
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    mongodb:
      host: localhost
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DB}
      username: ${MONGO_USER}
      password: ${MONGO_PASSWORD}
      authentication-database: admin
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    # logServerErrorDetail=false (URL JDBC): detaliul serverului (valori din chei) nu intră în mesajele excepțiilor.
    # Conflictele de constrângeri (ex. suprapunere de concedii) devin 409; Hibernate le-ar loga la ERROR cu valorile cheii.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

app:
  jwt:
    secret: ${JWT_SECRET}
